name: Preview
on:
  workflow_dispatch:
    inputs:
      video:
        required: true
      times:
        required: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p pv && python preview.py "$PWD/videos/${{ inputs.video }}/video.html" pv "${{ inputs.times }}"
      - run: |
          ffmpeg -y -loglevel error -pattern_type glob -i 'pv/p*.jpg' -vf "scale=180:320,tile=6x2" -frames:v 1 -q:v 9 sheet.jpg
          ls -la sheet.jpg
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "preview-${{ inputs.video }}" -y --cleanup-tag || true
          gh release create "preview-${{ inputs.video }}" sheet.jpg pv/*.jpg --title "preview" --notes "preview"
