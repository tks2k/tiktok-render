  g2.lineCap = 'round'; g2.lineWidth = 18; g2.strokeStyle = '#2a3446'; g2.beginPath(); g2.arc(cx, cy + 40, 110, PI, 2 * PI); g2.stroke(); g2.strokeStyle = '#ff6a4a'; g2.beginPath(); g2.arc(cx, cy + 40, 110, PI, PI + PI * 0.85 * v); g2.stroke();

  g2.fillStyle = '#7d8590'; [[0.2, 0.3], [0.6, 0.6], [0.35, 0.75], [0.8, 0.25]].forEach(([u, v]) => { g2.beginPath(); g2.arc(W / 2 - 380 + 140 * u, cy - 55 + 110 * v, 8, 0, 2 * PI); g2.fill(); });

function drawBeep(a){ if (a <= 0) return; const p = wl(ben.head, 0, 0.5, 0); if (!p) return; g2.save(); for (let i = 0; i < 3; i++){ const f = ((T * 1.2) + i / 3) % 1; g2.globalAlpha = a * (1 - f); g2.lineWidth = 12; g2.strokeStyle = '#ffd23c'; g2.beginPath(); g2.arc(p[0], p[1], 60 + f * 320, 0, 2 * PI); g2.stroke(); }
  g2.globalAlpha = a; chip(W / 2, 1690, 820, 160); txt('PIEP … PIEP … HIER!', W / 2, 1690, 54, '#ffd23c'); g2.restore(); }

function heart(x, y, s){ g2.beginPath(); g2.moveTo(x, y + 0.35 * s); g2.bezierCurveTo(x - 1.1 * s, y - 0.35 * s, x - 0.45 * s, y - 1.0 * s, x, y - 0.45 * s); g2.bezierCurveTo(x + 0.45 * s, y - 1.0 * s, x + 1.1 * s, y - 0.35 * s, x, y + 0.35 * s); g2.closePath(); }
function drawHeart(a){ if (a <= 0) return; const ph = (T * 2.5) % 1, beat = ph < 0.15 ? Math.sin(ph / 0.15 * PI) : 0, s = 70 * (1 + 0.22 * beat);
  g2.save(); g2.globalAlpha = a; heart(W / 2, 660, s); g2.fillStyle = '#ff3b3b'; g2.fill(); g2.lineWidth = 10; g2.strokeStyle = '#0b1220'; g2.stroke(); g2.restore(); }
const vig = document.createElement('canvas'); vig.width = 270; vig.height = 480;
(function(){ const x = vig.getContext('2d'), g = x.createRadialGradient(135, 240, 120, 135, 240, 330); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.38)'); x.fillStyle = g; x.fillRect(0, 0, 270, 480); })();
function draw2D(sc, lt, dur){
  g2.globalAlpha = 1; g2.globalCompositeOperation = 'source-over'; g2.drawImage(renderer.domElement, 0, 0, W, H);
  g2.globalAlpha = 1; g2.globalCompositeOperation = 'source-over'; g2.drawImage(vig, 0, 0, W, H);
  if (flashA > 0){ g2.fillStyle = `rgba(255,250,240,${Math.min(1, flashA)})`; g2.fillRect(0, 0, W, H); }
  if (fadeBlk > 0){ g2.fillStyle = `rgba(0,0,0,${fadeBlk})`; g2.fillRect(0, 0, W, H); }
  drawSpd(spdK); drawAir(airK); drawBet(betK); drawSur(surK); drawBeep(beepK);
  if (sc.hud) drawHud(sc.hud());
  if (sc.hook) drawHook(clamp01((dur - lt) / 0.15), 1);
  if (sc.loopin){ const k = clamp01((T - (END - 0.14)) / 0.14); drawHook(k, 1 + 0.25 * (1 - k)); }
  if (!sc.hook) drawSubs();

/* =========================================================
   ABLAUF
   ========================================================= */
let curI = -1, curS = SCN[0], curLt = 0;
function step(){
  let i = 0; while (i < SCN.length - 1 && T >= SCN[i + 1].t) i++;
  const sc = SCN[i];
  if (i !== curI){ curI = i; SETS.forEach(s => s.visible = s === sc.set); setMood(sc.mood); if (sc.enter) sc.enter(); }
  blurAmt = 0; fadeBlk = 0; flashA = 0; ben.mouth.rotation.z = 0; ben.root.rotation.z = 0;
  talk = 0; spdK = airK = betK = surK = beepK = 0; ben.root.rotation.set(0, 0, 0); curS = sc; curLt = T - sc.t; sc.upd(curLt); benMark();
  if (T >= END && !ended) finish();
}
let vTrack = null;
function frame(){
  renderer.render(scene, cam);
  draw2D(curS, curLt, (curI < SCN.length - 1 ? SCN[curI + 1].t : END) - curS.t);
  if (recording && vTrack) vTrack.requestFrame();
}
let playing = false, startMs = 0, ended = false, rec = null, chunks = [], recording = false, videoBlob = null;
function reset(){ T = 0; curI = -1; ended = false; hv = hp = hl = ''; hvT = hpT = hlT = -9; step(); }
function loop(now){
  requestAnimationFrame(loop);
  if (exporting) return;
  if (playing){ T = Math.min((now - startMs) / 1000, END + 0.3); step(); }
  frame();
}
function startRec(){
  if (!out.captureStream || typeof MediaRecorder === 'undefined'){ ui.innerHTML = '<p>Aufnahme wird von diesem Browser nicht unterstützt.</p>'; ui.classList.remove('hidden'); return false; }
  let stream; try { stream = out.captureStream(0); vTrack = stream.getVideoTracks()[0]; if (!vTrack || !vTrack.requestFrame) throw 0; } catch (e) { stream = out.captureStream(30); vTrack = null; }
  const types = ['video/mp4', 'video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = types.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  try { rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 10000000 } : {}); } catch (e) { rec = new MediaRecorder(stream); }
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => { vTrack = null; videoBlob = new Blob(chunks, { type: rec.mimeType || mime || 'video/webm' }); recording = false; recdot.style.display = 'none'; showUI('end'); };
  rec.start(); recording = true; recdot.style.display = 'block'; return true;
}
/* Bild-für-Bild-Export: H.264 über WebCodecs + eigener MP4-Schreiber (kein Echtzeit-Mitschnitt) */
function mp4Build(samples, avcC, w, h, fps){
  const enc = new TextEncoder();
  const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255], u16 = n => [(n >> 8) & 255, n & 255];
  const cat = arrs => { let L = 0; arrs.forEach(a => L += a.length); const o = new Uint8Array(L); let p = 0; arrs.forEach(a => { o.set(a, p); p += a.length; }); return o; };
  const box = (type, ...parts) => { const body = cat(parts.map(p => p instanceof Uint8Array ? p : new Uint8Array(p))); return cat([new Uint8Array(u32(body.length + 8)), enc.encode(type), body]); };
  const full = (type, ver, flags, ...parts) => box(type, [ver, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255], ...parts);
  const n = samples.length, dur = n, MAT = [].concat(u32(0x10000), u32(0), u32(0), u32(0), u32(0x10000), u32(0), u32(0), u32(0), u32(0x40000000));
  // Reihenfolge der Anzeige (falls der Encoder B-Bilder liefert)
  let shift = 0; const off = samples.map((s, i) => { const d = s.pts - i; if (-d > shift) shift = -d; return d; }); const needCtts = off.some(d => d !== 0);
  const sync = []; samples.forEach((s, i) => { if (s.key) sync.push(i + 1); });
  const stsd = full('stsd', 0, 0, u32(1), box('avc1', [0, 0, 0, 0, 0, 0], u16(1), u16(0), u16(0), u32(0), u32(0), u32(0), u16(w), u16(h), u32(0x480000), u32(0x480000), u32(0), u16(1), new Uint8Array(32), u16(24), [255, 255], box('avcC', avcC)));
  const stbl = stco => box('stbl', stsd,
    full('stts', 0, 0, u32(1), u32(n), u32(1)),
    needCtts ? full('ctts', 0, 0, u32(n), cat(off.map(d => new Uint8Array(u32(1).concat(u32(d + shift)))))) : new Uint8Array(0),
    full('stss', 0, 0, u32(sync.length), cat(sync.map(i => new Uint8Array(u32(i))))),
    full('stsc', 0, 0, u32(1), u32(1), u32(n), u32(1)),
    full('stsz', 0, 0, u32(0), u32(n), cat(samples.map(s => new Uint8Array(u32(s.data.length))))),
    full('stco', 0, 0, u32(1), u32(stco)));
  const moov = stco => box('moov',
    full('mvhd', 0, 0, u32(0), u32(0), u32(fps), u32(dur), u32(0x10000), u16(0x100), u16(0), u32(0), u32(0), MAT, new Uint8Array(24), u32(2)),
    box('trak',
      full('tkhd', 0, 3, u32(0), u32(0), u32(1), u32(0), u32(dur), u32(0), u32(0), u16(0), u16(0), u16(0), u16(0), MAT, u32(w << 16), u32(h << 16)),
      box('mdia',
        full('mdhd', 0, 0, u32(0), u32(0), u32(fps), u32(dur), u16(0x55c4), u16(0)),
        full('hdlr', 0, 0, u32(0), enc.encode('vide'), u32(0), u32(0), u32(0), enc.encode('Video\0')),
        box('minf', full('vmhd', 0, 1, u16(0), u16(0), u16(0), u16(0)), box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))), stbl(stco)))));
  const ftyp = box('ftyp', enc.encode('isom'), u32(0x200), enc.encode('isomiso2avc1mp41'));
  const mv = moov(ftyp.length + moov(0).length + 8);
  let L = 0; samples.forEach(s => L += s.data.length);
  return new Blob([ftyp, mv, new Uint8Array(u32(L + 8)), enc.encode('mdat')].concat(samples.map(s => s.data)), { type: 'video/mp4' });
}
async function exportMP4(canvas, total, fps, renderAt, onProgress){
  const w = canvas.width, h = canvas.height; let cfg = null;
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42002a', 'avc1.42e028']){
    const c = { codec, width: w, height: h, bitrate: 12000000, framerate: fps, avc: { format: 'avc' } };
    try { const r = await VideoEncoder.isConfigSupported(c); if (r && r.supported){ cfg = c; break; } } catch (e) {}
  }
  if (!cfg) throw new Error('H.264 wird nicht unterstützt');
  const samples = []; let avcC = null, err = null; const usPer = 1e6 / fps;
  const enc = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description && !avcC){ const d = meta.decoderConfig.description; avcC = new Uint8Array(d.buffer ? d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength) : d); }
      const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data); samples.push({ data, key: chunk.type === 'key', pts: Math.round(chunk.timestamp / usPer) });
    },
    error: e => { err = e; },
  });
  enc.configure(cfg);
  for (let i = 0; i < total; i++){
    if (err) throw err;
    renderAt(i);
    const vf = new VideoFrame(canvas, { timestamp: Math.round(i * usPer), duration: Math.round(usPer) });
    enc.encode(vf, { keyFrame: i % 60 === 0 }); vf.close();
    while (enc.encodeQueueSize > 2) await new Promise(r => setTimeout(r, 4));
    if (i % 3 === 0){ onProgress && onProgress(i / total); await new Promise(r => setTimeout(r, 0)); }
  }
  await enc.flush(); enc.close(); if (err) throw err;
  if (!avcC || !samples.length) throw new Error('Encoder hat keine Daten geliefert');
  return mp4Build(samples, avcC, w, h, fps);
}
let exporting = false;
async function doExport(){
  reset(); exporting = true; playing = false; videoBlob = null; ui.classList.remove('hidden');
  ui.innerHTML = '<h1>Video wird erstellt …</h1><p id="prog" style="font-size:34px;font-weight:800;opacity:1">0 %</p><p>Bild für Bild in voller Qualität. Bitte die Seite offen lassen und den Bildschirm nicht sperren.</p>';
  const pr = document.getElementById('prog');
  try {
    videoBlob = await exportMP4(out, Math.floor(END * 30), 30, i => { T = i / 30; step(); frame(); }, p => { pr.textContent = Math.round(p * 100) + ' %'; });
    exporting = false; ended = true; showUI('end');
  } catch (e) {
    exporting = false; showUI('start');
    const m = document.createElement('p'); m.style.color = '#ffb3a0'; m.textContent = 'Export hat nicht geklappt (' + (e && e.message ? e.message : e) + '). Du kannst stattdessen „Aufnehmen“ nutzen.'; ui.appendChild(m);
  }
}
let claudeDL = null;
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { claudeDL = d; }).catch(() => {}); } catch (e) {}
async function saveVideo(){
  if (!videoBlob) return;
  const fname = `was-waere-ben-lawine.${videoBlob.type.includes('mp4') ? 'mp4' : 'webm'}`;
  if (claudeDL){ try { await claudeDL.save({ filename: fname, data: videoBlob }); return; } catch (e) { if (e && e.code === 'declined') return; } }
  const file = new File([videoBlob], fname, { type: videoBlob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })){ try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = fname; document.body.appendChild(a); a.click(); a.remove();
}
function finish(){ ended = true; playing = false; if (recording && rec) setTimeout(() => rec.stop(), 300); else showUI('end'); }
function begin(withRec){
  reset(); if (withRec){ videoBlob = null; if (!startRec()) return; }
  ui.classList.add('hidden'); playing = true; startMs = performance.now();
}
function showUI(mode){
  ui.classList.remove('hidden');
  if (mode === 'start'){
    ui.innerHTML = `<h1>Was wäre Ben? – Lawine</h1><p>9:16 · 1080 × 1920 · ca. 24 s · Sprecher-Spur (ElevenLabs, „Take 1 – Sprecher Airbag“) ab 0:00 drunterlegen</p>
      <button class="b1" id="bPlay">▶ Abspielen</button>
      ${window.VideoEncoder ? '<button class="b3" id="bExp">💾 Als MP4-Video exportieren</button><p style="font-size:12px;opacity:.7">Der Export rechnet jedes Bild einzeln. Das Ergebnis läuft flüssig, auch wenn das Handy langsam ist.</p>' : ''}
      <button class="b2" id="bRec">⏺ Live aufnehmen${window.VideoEncoder ? ' (Notlösung)' : ' &amp; speichern'}</button>`;
  } else {
    if (videoBlob && !videoBlob._url) videoBlob._url = URL.createObjectURL(videoBlob);
    ui.innerHTML = `<h1>Fertig!</h1>
      ${videoBlob ? `<video src="${videoBlob._url}" controls playsinline muted style="max-height:38vh;max-width:80vw;border-radius:12px;background:#000"></video><button class="b3" id="bSave">💾 Video speichern</button>` : ''}
      <button class="b1" id="bPlay">↺ Nochmal ansehen</button>${window.VideoEncoder ? '<button class="b2" id="bExp">💾 Neu exportieren</button>' : '<button class="b2" id="bRec">⏺ Aufnehmen &amp; speichern</button>'}`;
  }
  const bp = document.getElementById('bPlay'), br = document.getElementById('bRec'), bs = document.getElementById('bSave');
  bp && (bp.onclick = () => begin(false)); br && (br.onclick = () => begin(true)); bs && (bs.onclick = saveVideo); const be = document.getElementById('bExp'); be && (be.onclick = doExport);
}
reset(); showUI('start'); requestAnimationFrame(loop);
})();
